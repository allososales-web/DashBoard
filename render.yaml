services:
  # ─── Backend (NestJS API) ───────────────────────────────────────
  - type: web
    name: store-ops-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: store-ops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: CORS_ORIGIN
        value: https://store-ops-frontend.onrender.com

  # ─── Frontend (React SPA) ──────────────────────────────────────
  - type: web
    name: store-ops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://store-ops-api.onrender.com

databases:
  # ─── PostgreSQL ────────────────────────────────────────────────
  - name: store-ops-db
    databaseName: store_ops
    user: store_ops_user
    plan: free
